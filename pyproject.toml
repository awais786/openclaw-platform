[project]
name = "openclaw"
version = "0.1.0"
description = "AI Customer Engagement engine — standalone, connects to Django over REST when needed"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",      # DjangoBackend REST client
    "pydantic>=2.7",    # tool schemas / validation
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["openclaw*"]
