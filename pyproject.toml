[project]
name = "openclaw"
version = "0.1.0"
description = "AI Customer Engagement engine — standalone, connects to Django over REST when needed"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69",  # Claude provider (ClaudeLLM); engine falls back to a stub if absent
    "httpx>=0.27",      # DjangoBackend REST client
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
openclaw = "openclaw.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["openclaw*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP042"]  # str+Enum kept for <3.11 interpreters; StrEnum is 3.11+

[tool.pytest.ini_options]
testpaths = ["tests"]
