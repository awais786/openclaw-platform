[project]
name = "openclaw"
version = "0.2.0"
description = "Draft contact-us replies grounded in a knowledge base, using Claude"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
openclaw = "openclaw.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["openclaw*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
